# =======================================
# SERVER CONFIGURATION
# =======================================
server.port=2003
server.servlet.context-path=/
spring.application.name=Wedding Services Platform API

# =======================================
# DATABASE CONFIGURATION (MySQL)
# =======================================
spring.datasource.url=jdbc:mysql://localhost:3306/WeddingDataBase_Project?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# =======================================
# JPA / HIBERNATE CONFIGURATION
# =======================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.flush_mode=AUTO
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.use_nationalized_character_data=false

# =======================================
# JWT CONFIGURATION
# =======================================
jwt.secret=WeddingPlatformSuperSecureJwtSecretKey12345
jwt.expiration-ms=86400000
jwt.refresh-expiration-ms=604800000

# =======================================
# CORS & FRONTEND INTEGRATION
# =======================================
# Frontend origins allowed for CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://192.168.1.4:3000}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600

# =======================================
# FILE UPLOAD CONFIGURATION
# =======================================
# AWS S3 Configuration (for future cloud storage)
aws.s3.bucket=wedding-services-portfolio
aws.region=ap-south-1

# Local file upload configuration
file.upload-dir=uploads
file.max-size=104857600
file.allowed-types=jpg,jpeg,png,pdf,docx
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=150MB

# =======================================
# SMS CONFIGURATION
# =======================================
fast2sms.api.key=YOUR_FAST2SMS_API_KEY_HERE
fast2sms.enabled=false

# =======================================
# ERROR & DEBUG CONFIGURATION
# =======================================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# =======================================
# EMAIL CONFIGURATION (GMAIL SMTP)
# =======================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# =======================================
# LOGGING CONFIGURATION
# =======================================
logging.level.root=INFO
logging.level.com.eventplatform=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.transaction=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n